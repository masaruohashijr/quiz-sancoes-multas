.jr { font-family: var(--font-anthropic-sans); display: flex; flex-direction: column; gap: var(--cds-gap-lg); }

.jr .tile .sub { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: var(--cds-gap-xs); }

.jr table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }

.jr .refresh { cursor:pointer; font:inherit; font-size:var(--cds-font-size-caption); font-weight:var(--cds-font-weight-medium); background:var(--color-panel); color:var(--color-fg); border:1px solid var(--color-border-line); border-radius:var(--cds-radius); padding:8px 14px; }

<script>
(() => {
  const JIRA = 'https://logusinfo.atlassian.net/browse/';

  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesNome = m => MESES[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
  const dt = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) + ' ' + d.slice(11, 16) : '';
  const pillCls = g => g === 'Atendida' ? ' ok' : g === 'Em aberto' ? ' warn' : g === 'Com restrições' ? ' bad' : '';
  const failLine = el => { el.innerHTML = ''; const d = document.createElement('div'); d.className = 'fail'; d.textContent = 'Failed to load'; el.appendChild(d); };
  function cell(tr, text, cls) { const td = tr.insertCell(); td.textContent = text; if (cls) td.className = cls; return td; }

  const button = document.getElementById("refresh-jira");
  const message = document.getElementById("refresh-msg");
  const API_BASE = "https://logusinfo.atlassian.net/rest/api/3/issue/";
  const emailInput = document.getElementById("jira-email");
  const tokenInput = document.getElementById("jira-token");
  emailInput.value = "masaru@logusinfo.com.br";

  function adfText(node) {
    if (!node) return "";
    if (typeof node === "string") return node;
    if (Array.isArray(node)) return node.map(adfText).join("");
    if (node.type === "hardBreak") return "\n";
    if (node.type === "text") return node.text || "";
    const content = adfText(node.content || []);
    return ["paragraph", "heading", "listItem", "bulletList", "orderedList", "blockquote"].includes(node.type) ? content + "\n" : content;
  }
  function grupoStatus(status) {
    const value = (status || "").toLowerCase();
    if (value.includes("cancelad")) return "Cancelada";
    if (value.includes("restri")) return "Com restrições";
    if (["finalizada", "homologado", "homologada", "concluída", "concluida", "resolvida", "resolvido", "done", "closed"].includes(value)) return "Atendida";
    return "Em aberto";
  }
  async function requestJira(url, auth) {
    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json", "Authorization": auth },
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Jira HTTP " + response.status + " (" + response.statusText + ")");
    return response.json();
  }
  async function getIssue(row, auth) {
    const key = encodeURIComponent(row.chave);
    const issue = await requestJira(API_BASE + key + "?fields=summary,status,reporter,created", auth);
    const fields = issue.fields || {};
    const patch = {
      resumo: fields.summary || row.resumo,
      status: fields.status?.name || row.status,
      reporter: fields.reporter?.displayName || row.reporter,
      grupo: grupoStatus(fields.status?.name || row.status),
      erro: null
    };
    try {
      const page = await requestJira(API_BASE + key + "/comment?maxResults=1&orderBy=-created", auth);
      const latest = page.comments?.[0];
      patch.comentario = latest ? adfText(latest.body).trim() || "(Comentário sem texto)" : "Sem comentários";
    } catch (err) {
      patch.erro = "Não foi possível consultar o comentário: " + err.message;
      patch.comentario = row.comentario || "Comentário indisponível";
    }
    return patch;
  }
  button.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const token = tokenInput.value.trim();
    if (!email || !token) {
      message.className = "refresh-msg error";
      message.textContent = "Informe o e-mail e o token de API para consultar o Jira.";
      return;
    }
    const auth = "Basic " + btoa(Array.from(new TextEncoder().encode(email + ":" + token), b => String.fromCharCode(b)).join(""));
    button.disabled = true;
    button.textContent = "Atualizando…";
    message.className = "refresh-msg";
    const rows = window.DASH_ROWS.map(r => ({ ...r }));
    let complete = 0, failures = 0;
    let next = 0;
    async function worker() {
      while (next < rows.length) {
        const idx = next++;
        const row = rows[idx];
        try {
          Object.assign(row, await getIssue(row, auth));
          if (row.erro) failures++;
        } catch (err) {
          failures++;
          row.erro = "Falha ao consultar " + row.chave + ": " + err.message;
          row.comentario = row.comentario || "Consulta indisponível";
        }
        complete++;
        message.textContent = "Consultando Jira: " + complete + "/" + rows.length + " chamados";
      }
    }
    try {
      await Promise.all(Array.from({length: Math.min(4, rows.length)}, worker));
      window.DASH_ROWS = rows;
      dash.setRows(rows);
      message.className = failures ? "refresh-msg error" : "refresh-msg";
      message.textContent = failures ?
        `${rows.length - failures}/${rows.length} consultados; ${failures} com erros. Consulte o aviso abaixo e passe o mouse na coluna de comentários.` :
        `${rows.length} chamados atualizados com sucesso.`;
      if (failures && rows.every(r => r.erro?.includes("Failed to fetch"))) {
        message.textContent = "O navegador bloqueou as chamadas à API (possível restrição CORS/rede). Um HTML local não pode contornar essa política; use um backend autorizado.";
      }
    } finally {
      button.disabled = false;
      button.textContent = "Atualizar";
    }
  });

  dash.onData(() => {
    const C = dash.data('chamados');

    const host = document.getElementById('months'); host.innerHTML = '';
    if (C.status === 'ok') {
      const rows = C.data;
      [...new Set(rows.map(r => r.mes))].sort().reverse().forEach(mes => {
        const rs = rows.filter(r => r.mes === mes);
        const at = rs.filter(r => r.grupo === 'Atendida').length;
        const card = document.createElement('div'); card.className = 'card'; card.id = 'mes-' + mes;
        const head = document.createElement('div'); head.className = 'mhead';
        const h = document.createElement('h2'); h.textContent = mesNome(mes);
        const st = document.createElement('div'); st.className = 'mstats';
        st.textContent = `${rs.length} aberto(s) · ${at} atendido(s) · ${rs.length - at} não atendido(s)`;
        head.append(h, st); card.appendChild(head);
        const wrap = document.createElement('div'); wrap.className = 'tw'; wrap.style.marginTop = 'var(--cds-gap-sm)';
        const t = document.createElement('table');
        t.dataset.source = 'chamados'; t.dataset.rowKey = 'chave';
        const hr = t.createTHead().insertRow();
        [['chave','Chave'],['resumo','Chamado'],['comentario','Último comentário'],['status','Status'],['reporter','Reporter'],['criado','Criado']].forEach(([f, l]) => {
          const th = document.createElement('th'); th.dataset.field = f; th.textContent = l; hr.appendChild(th);
        });
        const tb = t.createTBody();
        rs.forEach(r => {
          const tr = tb.insertRow(); tr.dataset.key = r.chave;
          if (r.grupo === 'Cancelada') tr.className = 'cancel';
          const kc = tr.insertCell(); kc.className = 'nw';
          const a = document.createElement('a'); a.href = JIRA + encodeURIComponent(r.chave); a.target = '_blank'; a.rel = 'noopener';
          a.className = 'key'; a.textContent = r.chave; kc.appendChild(a);
          cell(tr, r.resumo, 'res');
          const cm = cell(tr, r.comentario == null ? '—' : r.comentario, 'comment');
          if (r.erro) cm.title = r.erro;
          const sc = tr.insertCell(); const p = document.createElement('span'); p.className = 'pill' + pillCls(r.grupo); p.textContent = r.status; sc.appendChild(p);
          cell(tr, r.reporter);
          cell(tr, dt(r.criado), 'nw');
        });
        wrap.appendChild(t); card.appendChild(wrap); host.appendChild(card);
      });
    } else if (C.status === 'error') failLine(host);
  });
})();
</script>

</div>
</body>
